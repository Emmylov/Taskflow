openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orders
    description: TaskFlow project checkout operations
  - name: deliverables
    description: Project file delivery and review operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /payment-config:
    get:
      operationId: getPaymentConfig
      tags: [orders]
      summary: Get the configured payment model
      responses:
        "200":
          description: Current payment configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfig"
  /billing/plans:
    get:
      operationId: getBillingPlans
      tags: [orders]
      summary: Get monthly TaskFlow credit plans
      responses:
        "200":
          description: Credit plans and checkout availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPlanList"
  /account/credits:
    get:
      operationId: getAccountCredits
      tags: [orders]
      summary: Get the signed-in customer's request credit balance
      responses:
        "200":
          description: Credit balance and active plan state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditBalance"
        "401":
          description: Authentication required
  /billing/checkout:
    post:
      operationId: createBillingCheckout
      tags: [orders]
      summary: Start a hosted Whop checkout for a monthly credit plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingCheckoutInput"
      responses:
        "200":
          description: Hosted checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCheckoutResponse"
        "400":
          description: Invalid plan or return URL
        "401":
          description: Authentication required
        "503":
          description: Whop billing is not configured
  /account/brand-vault:
    get:
      operationId: getBrandVault
      tags: [orders]
      summary: Get the signed-in customer's brand kit and assets
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: string
        - name: taskId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Brand kit and private asset metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandVault"
        "401":
          description: Authentication required
    put:
      operationId: updateBrandVault
      tags: [orders]
      summary: Update the signed-in customer's brand kit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandVaultInput"
      responses:
        "200":
          description: Updated brand kit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandVault"
        "400":
          description: Invalid brand kit
        "401":
          description: Authentication required
  /account/brand-vault/assets:
    post:
      operationId: createBrandVaultAsset
      tags: [orders]
      summary: Add uploaded private brand asset metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandAssetInput"
      responses:
        "201":
          description: Brand asset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandAsset"
        "400":
          description: Invalid asset
        "401":
          description: Authentication required
  /account/brand-vault/assets/{assetId}:
    delete:
      operationId: deleteBrandVaultAsset
      tags: [orders]
      summary: Remove a brand asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Asset removed
        "401":
          description: Authentication required
        "404":
          description: Asset not found
  /storage/brand-vault/uploads/request-url:
    post:
      operationId: requestBrandVaultUpload
      tags: [orders]
      summary: Request a signed upload URL for a private brand asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandAssetUploadInput"
      responses:
        "200":
          description: Signed upload URL and object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderUploadUrlResponse"
        "401":
          description: Authentication required
  /owner/brand-vault/{userId}/export:
    get:
      operationId: exportBrandVaultBrief
      tags: [orders]
      summary: Export a customer's creative brief and brand assets as a ZIP
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Creative brief and brand assets
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          description: Authentication required
        "403":
          description: Owner access required
        "404":
          description: Brand vault not found
  /owner/automations:
    get:
      operationId: getOwnerAutomations
      tags: [orders]
      summary: Get owner automation configuration status
      responses:
        "200":
          description: Automation settings without secret endpoint values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationList"
        "401":
          description: Authentication required
        "403":
          description: Owner access required
    put:
      operationId: updateOwnerAutomation
      tags: [orders]
      summary: Configure an automation webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationInput"
      responses:
        "200":
          description: Updated automation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationStatus"
        "400":
          description: Invalid provider or endpoint
        "401":
          description: Authentication required
        "403":
          description: Owner access required
  /orders/requests:
    post:
      operationId: createOrderRequest
      tags: [orders]
      summary: Submit a TaskFlow project request for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: Project request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderRequestResponse"
        "400":
          description: Invalid project or cart
        "401":
          description: Authentication required
        "503":
          description: Notification provider unavailable
  /orders:
    get:
      operationId: getOrders
      tags: [orders]
      summary: Get the signed-in customer's project requests
      responses:
        "200":
          description: Project requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
        "401":
          description: Authentication required
  /orders/{orderId}:
    get:
      operationId: getOrderStatus
      tags: [orders]
      summary: Get the payment status for a TaskFlow order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatus"
        "404":
          description: Order not found
  /orders/{orderId}/activity:
    get:
      operationId: getOrderActivity
      tags: [orders]
      summary: Get the project activity timeline
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Activity timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"
        "401":
          description: Authentication required
        "404":
          description: Project not found
  /orders/{orderId}/deliverables:
    get:
      operationId: getOrderDeliverables
      tags: [deliverables]
      summary: Get the deliverables for a project
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project deliverables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverableList"
        "401":
          description: Authentication required
        "404":
          description: Project not found
    post:
      operationId: createOrderDeliverable
      tags: [deliverables]
      summary: Add a new deliverable version to a project
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliverableInput"
      responses:
        "201":
          description: Deliverable created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deliverable"
        "400":
          description: Invalid deliverable
        "401":
          description: Authentication required
        "403":
          description: Owner access required
        "404":
          description: Project not found
  /orders/{orderId}/deliverables/{deliverableId}/review:
    post:
      operationId: reviewOrderDeliverable
      tags: [deliverables]
      summary: Approve a deliverable or request changes
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: deliverableId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliverableReviewInput"
      responses:
        "200":
          description: Deliverable review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverableReviewResponse"
        "400":
          description: Invalid review
        "401":
          description: Authentication required
        "404":
          description: Deliverable not found
  /orders/{orderId}/deliverables/{deliverableId}/comments:
    get:
      operationId: getDeliverableComments
      tags: [deliverables]
      summary: Get timestamp and canvas-marker feedback for a deliverable
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: deliverableId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deliverable review comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverableCommentList"
        "401":
          description: Authentication required
        "404":
          description: Deliverable not found
    post:
      operationId: createDeliverableComment
      tags: [deliverables]
      summary: Add a timestamp, graphic-point, or general comment
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: deliverableId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliverableCommentInput"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverableComment"
        "400":
          description: Invalid comment marker
        "401":
          description: Authentication required
        "404":
          description: Deliverable not found
  /orders/{orderId}/approve-price:
    post:
      operationId: approveOrderPrice
      tags: [orders]
      summary: Approve the owner price proposal
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Price approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceDecisionResponse"
        "400":
          description: No proposal is ready
        "401":
          description: Authentication required
        "404":
          description: Order not found
  /orders/{orderId}/request-price-change:
    post:
      operationId: requestOrderPriceChange
      tags: [orders]
      summary: Request a change to the owner price proposal
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceChangeInput"
      responses:
        "200":
          description: Change request sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceDecisionResponse"
        "400":
          description: Feedback is invalid
        "401":
          description: Authentication required
        "404":
          description: Order not found
  /conversations/{orderId}/messages:
    get:
      operationId: getConversationMessages
      tags: [orders]
      summary: Get messages for a project conversation
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversation messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          description: Authentication required
        "404":
          description: Conversation not found
    post:
      operationId: createConversationMessage
      tags: [orders]
      summary: Add a message to a project conversation
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid message
        "401":
          description: Authentication required
        "404":
          description: Conversation not found
  /conversations/{orderId}/typing:
    get:
      operationId: getConversationTyping
      tags: [orders]
      summary: Get live typing state for a project conversation
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Typing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypingStatus"
        "401":
          description: Authentication required
        "404":
          description: Conversation not found
    post:
      operationId: updateConversationTyping
      tags: [orders]
      summary: Update the signed-in user's typing state
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TypingInput"
      responses:
        "200":
          description: Typing state updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "400":
          description: Invalid typing state
        "401":
          description: Authentication required
        "404":
          description: Conversation not found
  /conversations/{orderId}/messages/{messageId}/reactions:
    post:
      operationId: toggleMessageReaction
      tags: [orders]
      summary: Toggle a reaction on a message
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionInput"
      responses:
        "200":
          description: Reaction toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  active:
                    type: boolean
                required: [ok, active]
        "400":
          description: Invalid reaction
        "401":
          description: Authentication required
        "404":
          description: Message not found
  /account/role:
    get:
      operationId: getAccountRole
      tags: [account]
      summary: Get the signed-in user's workspace role and invitation status
      responses:
        "200":
          description: Workspace role and onboarding state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRole"
        "401":
          description: Authentication required
    put:
      operationId: updateAccountRole
      tags: [account]
      summary: Select the client role or accept an owner-issued invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRoleInput"
      responses:
        "200":
          description: Workspace role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRole"
        "401":
          description: Authentication required
        "403":
          description: A matching owner invitation is required
        "409":
          description: The account has a different invitation
  /specialist/assessment:
    get:
      operationId: getSpecialistAssessment
      tags: [specialist]
      summary: Get the authenticated specialist's assessment and current lockout state
      responses:
        "200":
          description: Assessment questions and access state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistAssessment"
        "401":
          description: Authentication required
        "403":
          description: Active specialist invitation required
  /specialist/assessment/submit:
    post:
      operationId: submitSpecialistAssessment
      tags: [specialist]
      summary: Submit answers for server-side scoring
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialistAssessmentInput"
      responses:
        "200":
          description: Assessment result and next allowed action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialistAssessment"
        "401":
          description: Authentication required
        "403":
          description: Active specialist invitation required
        "423":
          description: Assessment is locked until the lockout expires
  /owner/platform-readiness:
    get:
      operationId: getPlatformReadiness
      tags: [admin]
      summary: Get a secret-free platform readiness audit for the super admin
      responses:
        "200":
          description: Platform readiness summary with no credential values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformReadiness"
        "401":
          description: Authentication required
        "403":
          description: Super admin access required
  /owner/platform-handover:
    put:
      operationId: updatePlatformHandover
      tags: [admin]
      summary: Update super-admin handover details and encrypted provider credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformHandoverInput"
      responses:
        "200":
          description: Handover settings saved; secrets are never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformHandoverResponse"
        "401":
          description: Authentication required
        "403":
          description: Super admin access required
        "503":
          description: Secure encryption is unavailable
  /owner/tasks:
    get:
      operationId: getOwnerTasks
      tags: [admin]
      summary: List active production tasks
      responses:
        "200":
          description: Active production tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionTaskList"
        "401":
          description: Authentication required
        "403":
          description: Admin access required
  /owner/assignees:
    get:
      operationId: getOwnerAssignees
      tags: [admin]
      summary: List available task assignees
      responses:
        "200":
          description: Active admins and specialists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnerAssignee"
        "401":
          description: Authentication required
        "403":
          description: Admin access required
  /owner/team-members:
    get:
      operationId: getOwnerTeamMembers
      tags: [admin]
      summary: List invited and active team members
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnerTeamMember"
        "401":
          description: Authentication required
        "403":
          description: Admin access required
    post:
      operationId: createOwnerTeamMember
      tags: [admin]
      summary: Invite a specialist or another admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerTeamMemberInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerTeamMember"
        "400":
          description: Invalid team member
        "401":
          description: Authentication required
        "403":
          description: Admin access required
  /owner/team-members/{memberId}:
    delete:
      operationId: deleteOwnerTeamMember
      tags: [admin]
      summary: Remove a team member and unassign their tasks
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "401":
          description: Authentication required
        "403":
          description: Admin access required
        "404":
          description: Team member not found
  /specialist/tasks:
    get:
      operationId: getSpecialistTasks
      tags: [specialist]
      summary: List the signed-in specialist's assigned tasks
      responses:
        "200":
          description: Assigned task queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionTaskList"
        "401":
          description: Authentication required
        "403":
          description: Active specialist access required
  /specialist/tasks/{taskId}:
    patch:
      operationId: updateSpecialistTask
      tags: [specialist]
      summary: Update the status of an assigned task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialistTaskUpdate"
      responses:
        "200":
          description: Updated production task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionTask"
        "401":
          description: Authentication required
        "403":
          description: Task is not assigned to this specialist
        "404":
          description: Task not found
  /orders/{orderId}/tasks:
    get:
      operationId: getOrderTasks
      tags: [admin]
      summary: List tasks for a project
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionTaskList"
        "401":
          description: Authentication required
        "403":
          description: Admin access required
        "404":
          description: Project not found
    post:
      operationId: createOrderTask
      tags: [admin]
      summary: Add a task to a project
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionTaskInput"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionTask"
        "400":
          description: Invalid task
        "401":
          description: Authentication required
        "403":
          description: Admin access required
        "404":
          description: Project not found
  /orders/{orderId}/tasks/{taskId}:
    patch:
      operationId: updateOrderTask
      tags: [admin]
      summary: Update or assign a project task
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionTaskUpdate"
      responses:
        "200":
          description: Updated production task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionTask"
        "401":
          description: Authentication required
        "403":
          description: Admin access required
        "404":
          description: Task not found
  /storage/uploads/request-url:
    post:
      operationId: requestOrderUploadUrl
      tags: [orders]
      summary: Request a private project upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUploadInput"
      responses:
        "200":
          description: Signed upload URL and object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload request
        "401":
          description: Authentication required
        "403":
          description: No access to this project
